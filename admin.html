<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geschützter Bereich – Lehrplan Englisch</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-shell" id="login-screen">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <h1>Geschützter Bereich</h1>
    <p class="lead">
      Bitte melden Sie sich mit dem Passwort der Fachkonferenz Englisch an,
      um die Lehrplan-Inhalte zu bearbeiten.
    </p>
    <form id="login-form">
      <div class="field">
        <label for="login-password">Passwort</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <div id="login-alert" role="alert"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Anmelden</button>
    </form>
    <p class="field-hint" style="margin-top:1rem;">
      <a href="index.html">← Zurück zur öffentlichen Übersichtsseite</a>
    </p>
  </div>
</div>

<div class="admin-shell" id="app-shell" hidden>
  <aside class="admin-sidebar">
    <div class="brand">
      Lehrplan-Pflege
      <small>Fachkonferenz Englisch</small>
    </div>
    <nav class="admin-nav" id="admin-nav"></nav>
  </aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <strong id="save-status" class="save-status">Noch keine Änderungen</strong>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-sm" href="index.html" target="_blank" rel="noopener">👁️ Öffentliche Seite ansehen</a>
        <button class="btn btn-sm btn-primary" id="btn-publish-github">🚀 Direkt veröffentlichen</button>
        <button class="btn btn-sm" id="btn-export">⬇️ Daten exportieren</button>
        <label class="btn btn-sm file-input-label">
          ⬆️ Daten importieren
          <input type="file" id="btn-import" accept="application/json,.json,.js,text/javascript" />
        </label>
        <button class="btn btn-sm btn-danger" id="btn-reset">Zurücksetzen</button>
        <button class="btn btn-sm" id="btn-logout">Abmelden</button>
      </div>
    </div>
    <div id="publish-status"></div>
    <div id="admin-content"></div>
  </div>
</div>

<script src="default-data.js"></script>
<script src="store.js"></script>
<script src="markdown.js"></script>
<script src="admin.js"></script>
</body>
</html>
